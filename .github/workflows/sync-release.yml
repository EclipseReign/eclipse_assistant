name: Sync official desktop release

on:
  workflow_dispatch:
  schedule:
    - cron: "7-59/10 * * * *"
  push:
    branches: [main]
    paths: [".github/workflows/sync-release.yml", "scripts/**", "tests/**"]

permissions:
  contents: read

concurrency:
  group: official-release-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'EclipseReign/eclipse_assistant'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.cjs
      - name: Verify and publish complete official assets
        run: node scripts/sync-release.cjs --publish
        env:
          GH_TOKEN: ${{ github.token }}
